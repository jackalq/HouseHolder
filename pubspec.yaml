name: family_butler
description: Privacy-first household assistant with on-device Llama.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  http: ^1.6.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - shared/prompts/system_prompt.txt
    - skills/
    - formats/
