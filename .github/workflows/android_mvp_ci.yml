name: Android MVP CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: householder-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: householder-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch HouseHolder on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p emulator-artifacts
            adb install -r apk/app-debug.apk | tee emulator-artifacts/adb-install.txt
            adb logcat -c
            adb shell am start -W -n com.householder.app/.MainActivity | tee emulator-artifacts/am-start.txt
            sleep 5
            adb logcat -d -v threadtime > emulator-artifacts/logcat.txt
            adb exec-out screencap -p > emulator-artifacts/householder-home.png
            adb shell pidof com.householder.app | tr -d '\r' | tee emulator-artifacts/pid.txt
            test -s emulator-artifacts/pid.txt
            adb shell dumpsys activity activities > emulator-artifacts/activity.txt
            grep -Eq 'mResumedActivity.*com\.householder\.app|ResumedActivity.*com\.householder\.app|ACTIVITY com\.householder\.app/' emulator-artifacts/activity.txt
            adb shell uiautomator dump /sdcard/householder-window.xml
            adb pull /sdcard/householder-window.xml emulator-artifacts/householder-window.xml
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.householder\.app.*FATAL' emulator-artifacts/logcat.txt

      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: householder-emulator-smoke
          path: emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14
