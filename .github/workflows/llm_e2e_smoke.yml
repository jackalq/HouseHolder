name: LLM E2E Smoke

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/llm_e2e_smoke.yml'
      - 'android/app/build.gradle.kts'
      - 'android/app/src/androidTest/**'
      - 'android/app/src/main/kotlin/com/householder/app/RecommendedModelPackDownloader.kt'
      - 'android/app/src/main/kotlin/com/householder/app/LocalLlamaEngine.kt'

permissions:
  contents: read

jobs:
  llm-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download model and run one Llama inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: ./android
          script: |
            ./gradlew app:connectedDebugAndroidTest --no-daemon --stacktrace | tee ../llm-e2e-gradle.txt
            adb pull /sdcard/Android/data/com.householder.app/files/llm-e2e-output.txt ../llm-e2e-output.txt
            adb logcat -d -v threadtime > ../llm-e2e-logcat.txt

      - name: Upload LLM E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: householder-llm-e2e
          path: |
            llm-e2e-gradle.txt
            llm-e2e-output.txt
            llm-e2e-logcat.txt
            android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
