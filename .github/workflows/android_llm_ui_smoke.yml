name: Android LLM UI Smoke

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build current debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Download Qwen2.5 0.5B GGUF smoke model
        run: |
          mkdir -p smoke-model
          curl -fL --retry 4 --retry-delay 5 \
            -o smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf' | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real UI inference smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          disable-animations: true
          script: |
            set -eu
            mkdir -p llm-ui-smoke-artifacts

            adb install -r build/app/outputs/flutter-apk/app-debug.apk | tee llm-ui-smoke-artifacts/adb-install.txt

            # Inject the official Qwen2.5-0.5B Q4_K_M smoke weight into the
            # production Qwen GGUF slot. It exercises the exact same llama.cpp
            # loader and Qwen2.5 architecture while keeping CI runtime practical.
            adb push smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf /data/local/tmp/householder-smoke.gguf
            adb shell "run-as com.householder.app mkdir -p files/model-pack/qwen2.5-1.5b-instruct-q4_k_m"
            adb shell "run-as com.householder.app cp /data/local/tmp/householder-smoke.gguf files/model-pack/qwen2.5-1.5b-instruct-q4_k_m/qwen2.5-1.5b-instruct-q4_k_m.gguf"
            adb shell "run-as com.householder.app sh -c 'printf %s qwen2.5-1.5b-instruct-q4_k_m > files/model-pack/active_model.txt'"
            adb shell rm /data/local/tmp/householder-smoke.gguf

            adb logcat -c
            adb shell am force-stop com.householder.app
            adb shell am start -W -n com.householder.app/.MainActivity | tee llm-ui-smoke-artifacts/am-start.txt
            sleep 5

            find_button() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml llm-ui-smoke-artifacts/window.xml >/dev/null
              grep -q 'text="測試推理"' llm-ui-smoke-artifacts/window.xml
            }

            for i in $(seq 1 8); do
              if find_button; then break; fi
              adb shell input swipe 540 1700 540 650 450
              sleep 1
            done
            find_button

            python3 - <<'PY' > llm-ui-smoke-artifacts/tap.txt
            import re
            import xml.etree.ElementTree as ET
            root = ET.parse('llm-ui-smoke-artifacts/window.xml').getroot()
            for node in root.iter('node'):
                if node.attrib.get('text') == '測試推理':
                    m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib['bounds'])
                    if not m:
                        raise SystemExit('button bounds missing')
                    x1, y1, x2, y2 = map(int, m.groups())
                    print((x1+x2)//2, (y1+y2)//2)
                    break
            else:
                raise SystemExit('test inference button not found')
            PY
            TAP_X=$(cut -d' ' -f1 llm-ui-smoke-artifacts/tap.txt)
            TAP_Y=$(cut -d' ' -f2 llm-ui-smoke-artifacts/tap.txt)
            adb shell input tap "$TAP_X" "$TAP_Y"

            success=0
            for i in $(seq 1 120); do
              sleep 2
              adb shell uiautomator dump /sdcard/result.xml >/dev/null || true
              adb pull /sdcard/result.xml llm-ui-smoke-artifacts/result.xml >/dev/null || true
              if grep -q '推理失敗' llm-ui-smoke-artifacts/result.xml 2>/dev/null; then
                echo 'UI reported inference failure'
                break
              fi
              if grep -q '推理完成' llm-ui-smoke-artifacts/result.xml 2>/dev/null && grep -q 'llama.cpp' llm-ui-smoke-artifacts/result.xml 2>/dev/null; then
                success=1
                break
              fi
            done

            adb logcat -d -v threadtime > llm-ui-smoke-artifacts/logcat.txt
            adb exec-out screencap -p > llm-ui-smoke-artifacts/result.png
            adb shell dumpsys meminfo com.householder.app > llm-ui-smoke-artifacts/meminfo.txt
            adb shell "run-as com.householder.app ls -lh files/model-pack/qwen2.5-1.5b-instruct-q4_k_m" > llm-ui-smoke-artifacts/model-files.txt

            test "$success" -eq 1
            grep -q '推理完成' llm-ui-smoke-artifacts/result.xml
            grep -q 'llama.cpp' llm-ui-smoke-artifacts/result.xml
            ! grep -q '推理失敗' llm-ui-smoke-artifacts/result.xml
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.householder\.app.*FATAL' llm-ui-smoke-artifacts/logcat.txt

      - name: Upload LLM UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: householder-llm-ui-smoke
          path: llm-ui-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14
